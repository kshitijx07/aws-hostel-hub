apiVersion: apps/v1
kind: Deployment
metadata:
  name: hostelhub-backend
  namespace: default
  labels:
    app: hostelhub-backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: hostelhub-backend
  template:
    metadata:
      labels:
        app: hostelhub-backend
    spec:
      containers:
      - name: hostelhub-backend
        image: <DOCKERHUB_USERNAME>/hostelhub-backend:<TAG>
        imagePullPolicy: Always
        ports:
        - containerPort: 3001
        envFrom:
        - configMapRef:
            name: hostelhub-config
        - secretRef:
            name: hostelhub-secrets
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
